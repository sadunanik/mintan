<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MintanAI — Something Extraordinary is Building</title>
  <meta name="description" content="Something extraordinary is building. We're working quietly on what comes next.">
  <meta property="og:title" content="MintanAI — Something Extraordinary is Building">
  <meta property="og:description" content="Something extraordinary is building. We're working quietly on what comes next.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111'/><circle cx='16' cy='16' r='6' fill='none' stroke='%234F98A3' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%234F98A3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0D0C;
      --surface:   #131312;
      --surface2:  #181817;
      --border:    #252422;
      --border2:   #2E2C2A;
      --text:      #D4D3D1;
      --text-muted:#7A7876;
      --text-faint:#3E3D3B;
      --accent:    #4F98A3;
      --accent-glow: rgba(79,152,163,0.15);
      --font-display: 'DM Sans', sans-serif;
      --font-body:    'Inter', sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Noise Texture Overlay ────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      pointer-events: none;
      z-index: 1000;
      opacity: 0.6;
    }

    /* ─── Ambient Background ───────────────────────────────── */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0;
      animation: orb-appear 2s var(--ease-out) forwards;
    }
    .ambient-orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,152,163,0.12) 0%, transparent 70%);
      top: -200px; left: 50%;
      transform: translateX(-50%);
      animation-delay: 0.3s;
    }
    .ambient-orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(79,152,163,0.06) 0%, transparent 70%);
      bottom: 10%; right: -100px;
      animation-delay: 0.8s;
    }
    .ambient-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(79,152,163,0.05) 0%, transparent 70%);
      bottom: 20%; left: -80px;
      animation-delay: 1.2s;
    }
    @keyframes orb-appear {
      to { opacity: 1; }
    }

    /* ─── Grid Lines ───────────────────────────────────────── */
    .grid-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(79,152,163,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,152,163,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 0%, black 30%, transparent 80%);
    }

    /* ─── Layout ───────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ───────────────────────────────────────────── */
    header {
      padding: 28px clamp(24px, 6vw, 80px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fade-up 0.8s var(--ease-out) 0.2s forwards;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .logo-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      background: rgba(79,152,163,0.12);
      border: 1px solid rgba(79,152,163,0.25);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .badge-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    /* ─── Hero ─────────────────────────────────────────────── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(48px, 10vw, 100px) clamp(24px, 6vw, 80px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
      opacity: 0;
      animation: fade-up 0.8s var(--ease-out) 0.5s forwards;
    }
    .eyebrow::before,
    .eyebrow::after {
      content: '';
      display: block;
      width: 24px;
      height: 1px;
      background: var(--accent);
      opacity: 0.6;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(42px, 8vw, 96px);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      color: #ECEAE7;
      max-width: 820px;
      margin-bottom: 24px;
      opacity: 0;
      animation: fade-up 0.9s var(--ease-out) 0.65s forwards;
    }
    h1 .highlight {
      background: linear-gradient(135deg, #4F98A3 0%, #7BBEC6 50%, #4F98A3 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .subtitle {
      font-size: clamp(16px, 2vw, 19px);
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.65;
      margin-bottom: 44px;
      opacity: 0;
      animation: fade-up 0.9s var(--ease-out) 0.8s forwards;
    }

    /* ─── Stealth Badge ────────────────────────────────────── */
    .stealth-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 32px;
      border: 1px solid var(--border2);
      border-radius: 100px;
      opacity: 0;
      animation: fade-up 0.9s var(--ease-out) 0.95s forwards;
    }
    .stealth-badge-text {
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    /* ─── Features Row ─────────────────────────────────────── */
    .features {
      display: flex;
      justify-content: center;
      gap: clamp(24px, 5vw, 56px);
      padding: 0 clamp(24px, 6vw, 80px) 44px;
      flex-wrap: wrap;
      opacity: 0;
      animation: fade-up 0.9s var(--ease-out) 1.1s forwards;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }
    .feature-icon {
      width: 15px; height: 15px;
      color: var(--accent);
      opacity: 0.75;
      flex-shrink: 0;
    }

    /* ─── Divider ──────────────────────────────────────────── */
    .divider {
      margin: 0 clamp(24px, 6vw, 80px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2), transparent);
    }

    /* ─── Footer ───────────────────────────────────────────── */
    footer {
      padding: 24px clamp(24px, 6vw, 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      animation: fade-up 0.8s var(--ease-out) 1.25s forwards;
    }
    .footer-copy {
      font-size: 12px;
      color: var(--text-faint);
      text-align: center;
    }

    /* ─── Entrance Animations ──────────────────────────────── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Scan Lines ───────────────────────────────────────── */
    .scan-line {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.015) 2px,
        rgba(0,0,0,0.015) 4px
      );
    }

    /* ─── Particle Canvas ──────────────────────────────────── */
    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.5;
    }

    /* ─── Responsive ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .header-badge { display: none; }
      footer { flex-direction: column; align-items: center; text-align: center; gap: 10px; }
      .features { gap: 16px; }
    }

    /* ─── Reduced Motion ───────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Ambient background -->

  <div class="page">

  </div>

  <script>
    // ─── Particle System ───────────────────────────────────────
    const canvas = document.getElementById('particles-canvas');
    const ctx    = canvas.getContext('2d');

    let W, H, particles = [];
    const PARTICLE_COUNT = 55;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x  = Math.random() * W;
        this.y  = Math.random() * H;
        this.vx = (Math.random() - 0.5) * 0.25;
        this.vy = (Math.random() - 0.5) * 0.25 - 0.1;
        this.r  = Math.random() * 1.5 + 0.3;
        this.a  = Math.random() * 0.35 + 0.05;
        this.life = 0;
        this.maxLife = Math.random() * 400 + 200;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life++;
        if (this.life > this.maxLife || this.y < -10 || this.x < -10 || this.x > W + 10) {
          this.reset();
          this.y = H + 5;
        }
      }
      draw() {
        const progress = this.life / this.maxLife;
        const alpha = progress < 0.1
          ? (progress / 0.1) * this.a
          : progress > 0.8
            ? ((1 - progress) / 0.2) * this.a
            : this.a;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(79,152,163,${alpha})`;
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = new Particle();
        p.life = Math.floor(Math.random() * p.maxLife);
        particles.push(p);
      }
    }

    function drawConnections() {
      const maxDist = 130;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * 0.06;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(79,152,163,${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
    }

    let animFrame;
    function loop() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => { p.update(); p.draw(); });
      drawConnections();
      animFrame = requestAnimationFrame(loop);
    }

    resize();
    initParticles();
    loop();

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        cancelAnimationFrame(animFrame);
        resize();
        initParticles();
        loop();
      }, 150);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(animFrame);
      else { initParticles(); loop(); }
    });
  </script>
<script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
