<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mintan.ai</title>
  <meta name="description" content="Something extraordinary is building." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #fafaf7;
      --ink: #1a1a18;
      --ink-muted: #8a8a82;
      --ink-faint: #d4d4cc;
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-border: #9FE1CB;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Top nav bar */
    nav {
      padding: 28px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.1s forwards;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--green);
    }

    .nav-badge {
      font-size: 10px;
      letter-spacing: 2.5px;
      color: var(--green);
      border: 1px solid var(--green-border);
      padding: 5px 14px;
      border-radius: 20px;
      background: var(--green-light);
      text-transform: uppercase;
    }

    /* Main content */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      position: relative;
      z-index: 1;
    }

    .center {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    /* Decorative top line */
    .deco-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, transparent, var(--ink-faint));
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(52px, 9vw, 84px);
      letter-spacing: 8px;
      color: var(--ink);
      line-height: 1;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.3s forwards;
    }

    .headline-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-left: 4px;
      vertical-align: top;
      margin-top: 14px;
      opacity: 0;
      animation: fadeUp 0.9s ease 0.5s forwards, pulse 3s ease-in-out 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
    }

    .domain {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--ink-muted);
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.55s forwards;
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--ink-faint);
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.65s forwards;
    }

    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: var(--ink-muted);
      line-height: 1.8;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.75s forwards;
    }

    /* Email signup */
    .notify-form {
      display: flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--ink-faint);
      border-radius: 4px;
      overflow: hidden;
      max-width: 360px;
      margin: 0 auto 48px;
      background: white;
      transition: border-color 0.2s ease;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.85s forwards;
    }

    .notify-form:focus-within {
      border-color: var(--green-border);
    }

    .notify-form input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: var(--ink);
      background: transparent;
      letter-spacing: 0.3px;
    }

    .notify-form input::placeholder {
      color: var(--ink-faint);
    }

    .notify-form button {
      border: none;
      border-left: 1px solid var(--ink-faint);
      background: transparent;
      padding: 12px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--green);
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .notify-form button:hover {
      background: var(--green-light);
    }

    .notify-form.submitted input,
    .notify-form.submitted button {
      display: none;
    }

    .thank-you {
      display: none;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--green);
      text-align: center;
      padding: 12px 0;
      text-transform: uppercase;
    }

    .notify-form.submitted + .thank-you {
      display: block;
    }

    /* Bottom decoration */
    .deco-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      animation: fadeUp 0.8s ease 1s forwards;
    }

    .deco-tick {
      width: 24px;
      height: 1px;
      background: var(--ink-faint);
    }

    .deco-text {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    /* Footer */
    footer {
      padding: 28px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.1s forwards;
    }

    .footer-left {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--ink-faint);
    }

    .footer-right {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--ink-faint);
    }

    .footer-right a {
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-right a:hover {
      color: var(--green);
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      nav, footer {
        padding: 20px 24px;
      }

      main {
        padding: 24px;
      }

      .headline {
        letter-spacing: 4px;
      }

      .notify-form {
        flex-direction: column;
        border-radius: 4px;
      }

      .notify-form button {
        border-left: none;
        border-top: 1px solid var(--ink-faint);
        width: 100%;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">mintan<span>.ai</span></a>
    <div class="nav-badge">coming soon</div>
  </nav>

  <main>
    <div class="center">
      <div class="deco-line"></div>

      <h1 class="headline">mintan<span class="headline-dot"></span></h1>

      <p class="domain">mintan.ai</p>

      <div class="divider"></div>

      <p class="tagline">
        Something extraordinary is building.<br>
        We're working quietly on what comes next.
      </p>

      <div class="notify-form" id="notifyForm">
        <input type="email" id="emailInput" placeholder="your@email.com" autocomplete="email" />
        <button onclick="handleNotify()">Notify me</button>
      </div>
      <p class="thank-you" id="thankYou">You're on the list</p>

      <div class="deco-bottom">
        <div class="deco-tick"></div>
        <span class="deco-text">stealth mode</span>
        <div class="deco-tick"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-left">&copy; 2026 mintan.ai</div>
    <div class="footer-right">
      <a href="mailto:hello@mintan.ai">hello@mintan.ai</a>
    </div>
  </footer>

  <script>
    function handleNotify() {
      const input = document.getElementById('emailInput');
      const form = document.getElementById('notifyForm');
      const thanks = document.getElementById('thankYou');
      const email = input.value.trim();

      if (!email || !email.includes('@')) {
        input.style.borderBottom = '1px solid #E24B4A';
        input.focus();
        return;
      }

      form.classList.add('submitted');
      thanks.style.display = 'block';
    }

    document.getElementById('emailInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleNotify();
    });
  </script>

</body>
</html>
